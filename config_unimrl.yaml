batch_size: 32
epochs: 100
eval_every_n_epochs: 1
fine_tune_from: pretrained_gin
log_every_n_steps: 50
init_lr: 0.0005
init_base_lr: 0.0001
weight_decay: 1.0e-6
gpu: cuda:0
task_name:

# Equation (8) and Equation (9) in the Uni-MRL paper.
contrastive_temperature: 0.5
contrastive_weight: 1.0

model_type: gin
model:
  num_layer: 5
  emb_dim: 300
  feat_dim: 512
  drop_ratio: 0.0
  pool: mean

dataset:
  num_workers: 4
